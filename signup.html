<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoutwave Sign Up</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="signup">
  <main class="auth-page">
    <section class="auth-hero">
      <img src="/assets/logos/Scoutwave-logo-light-theme.svg" alt="Scoutwave Logo" class="app-logo">
      <h1 class="auth-title">Sign up to Scoutwave and get football predictions</h1>
      <p class="auth-subtitle">Create your account to start exploring matches, tips, and insights.</p>
    </section>

    <section class="auth-card">
      <div class="notice" data-notice></div>

      <button type="button" class="google-auth-button" data-google-signup>
        <span class="google-auth-icon" aria-hidden="true">
          <svg width="30" height="30" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <g fill="none" fill-rule="evenodd" clip-rule="evenodd">
              <path fill="#F44336" d="M7.209 1.061c.725-.081 1.154-.081 1.933 0a6.57 6.57 0 0 1 3.65 1.82a100 100 0 0 0-1.986 1.93q-1.876-1.59-4.188-.734q-1.696.78-2.362 2.528a78 78 0 0 1-2.148-1.658a.26.26 0 0 0-.16-.027q1.683-3.245 5.26-3.86" opacity=".987" />
              <path fill="#FFC107" d="M1.946 4.92q.085-.013.161.027a78 78 0 0 0 2.148 1.658A7.6 7.6 0 0 0 4.04 7.99q.037.678.215 1.331L2 11.116Q.527 8.038 1.946 4.92" opacity=".997" />
              <path fill="#448AFF" d="M12.685 13.29a26 26 0 0 0-2.202-1.74q1.15-.812 1.396-2.228H8.122V6.713q3.25-.027 6.497.055q.616 3.345-1.423 6.032a7 7 0 0 1-.51.49" opacity=".999" />
              <path fill="#43A047" d="M4.255 9.322q1.23 3.057 4.51 2.854a3.94 3.94 0 0 0 1.718-.626q1.148.812 2.202 1.74a6.62 6.62 0 0 1-4.027 1.684a6.4 6.4 0 0 1-1.02 0Q3.82 14.524 2 11.116z" opacity=".993" />
            </g>
          </svg>
        </span>
        <span>Sign up with Google</span>
      </button>

      <div class="auth-divider">
        <span>Or</span>
      </div>

      <form id="signupForm" class="form-grid" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <input class="input" id="fullName" type="text" autocomplete="name" placeholder="Your full name" />
          <small class="error-text"></small>
        </div>

        <div class="field">
          <label for="signupEmail">Email Address</label>
          <input class="input" id="signupEmail" type="email" autocomplete="email" placeholder="Enter your email" />
          <small class="error-text"></small>
        </div>

        <div class="split-2">
          <div class="field">
            <label for="signupPassword">Create Password</label>
            <div class="input-stack">
              <input class="input" id="signupPassword" type="password" autocomplete="new-password" placeholder="Create a password" />
              <button type="button" class="icon-toggle" data-password-toggle="signupPassword">Show</button>
            </div>
            <small class="error-text"></small>
          </div>

          <div class="field">
            <label for="signupConfirm">Confirm Password</label>
            <div class="input-stack">
              <input class="input" id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password" />
              <button type="button" class="icon-toggle" data-password-toggle="signupConfirm">Show</button>
            </div>
            <small class="error-text"></small>
          </div>
        </div>

        <button type="submit" class="primary">
          <span class="btn-label">Create account</span>
          <span class="spinner"></span>
        </button>

        <p class="form-footer">
          Already have an account?
          <a class="secondary-link" href="/login">Login</a>
        </p>

        <small class="form-footer-txt-final">
          By signing up, you agree to the
          <a href="/terms">Terms &amp; Conditions</a>
          and
          <a href="/privacy">Privacy Policy</a>
        </small>
      </form>
    </section>
  </main>

  <script src="/js/script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase/client.js"></script>
  <script src="/supabase/auth.js"></script>
  <script src="/supabase/database.js"></script>
  <script src="/supabase/storage.js"></script>
</body>
</html>
