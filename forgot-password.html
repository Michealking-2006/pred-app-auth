<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoutwave Forgot Password</title>
  
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="forgot">
  <main class="auth-page">
    <section class="auth-hero">
      <img src="/assets/logos/Scoutwave-logo-light-theme.svg"  alt="Scoutwave Logo" class="app-logo">
      <h1 class="auth-title">Reset password</h1>
<p class="auth-subtitle">Not to worry. We will send a link to reset your password to your mail.</p>
    </section>

    <section class="auth-card">

      <div class="notice" data-notice></div>

      


      <form id="forgotForm" class="form-grid" novalidate>
        <div class="field">
          <label for="forgotEmail">Email address</label>
          <input class="input" id="forgotEmail" type="email" autocomplete="email" placeholder="you@example.com" />
          <small class="error-text"></small>
        </div>

        <button type="submit" class="primary">
          <span class="btn-label">Send reset code</span>
          <span class="spinner"></span>
        </button>

        <p class="form-footer">
          Back to
          <a class="secondary-link" href="login">Login</a>
        </p>
      </form>

    </section>
  </main>

  
  <script src="/js/script.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase/client.js"></script>

<script src="/supabase/auth.js"></script>
<script src="/supabase/database.js"></script>
<script src="/supabase/storage.js"></script>

</body>
</html>
