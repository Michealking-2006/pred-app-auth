<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoutwave Reset Password</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="reset">
  <main class="auth-page">
    <section class="auth-hero">
      <img src="/assets/logos/scoutwave-logo.png"  alt="Scoutwave Logo" class="app-logo">
 <h1 class="auth-title">Reset password</h1>
 <p class="auth-subtitle">Use the code sent to you via email to create a new password.</p>
    </section>

    <section class="auth-card">
      
      <div class="notice" data-notice></div>

     


      <div class="small-note" data-reset-code-note hidden>
        Demo reset code: <strong data-reset-code-preview></strong>
      </div>

      <form id="resetForm" class="form-grid" novalidate style="margin-top:16px">
        <div class="field">
  <label for="resetCode">Reset code</label>
  <input class="input" id="resetCode" type="text" inputmode="numeric" placeholder="6-digit code" />
  <small class="error-text"></small>
</div>
        <div class="field">
          <label for="resetEmail">Email address</label>
          <input class="input" id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com" />
          <small class="error-text"></small>
        </div>

        <div class="split-2">
          <div class="field">
            <label for="newPassword">New password</label>
            <div class="input-stack">
              <input class="input" id="newPassword" type="password" autocomplete="new-password" placeholder="New password" />
              <button type="button" class="icon-toggle" data-password-toggle="newPassword">Show</button>
            </div>
            <small class="error-text"></small>
          </div>

          <div class="field">
            <label for="confirmNewPassword">Confirm password</label>
            <div class="input-stack">
              <input class="input" id="confirmNewPassword" type="password" autocomplete="new-password" placeholder="Repeat new password" />
              <button type="button" class="icon-toggle" data-password-toggle="confirmNewPassword">Show</button>
            </div>
            <small class="error-text"></small>
          </div>
        </div>

        <button type="submit" class="primary">
          <span class="btn-label">Update password</span>
          <span class="spinner"></span>
        </button>

        <p class="form-footer">
          Back to
          <a class="secondary-link" href="login">Login</a>
        </p>
      </form>

    </section>
  </main>

  <script src="/js/script.js"></script>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase/client.js"></script>

<script src="/supabase/auth.js"></script>
<script src="/supabase/database.js"></script>
<script src="/supabase/storage.js"></script>
</body>
</html>
