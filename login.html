<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoutwave Login</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="login">
  <main class="auth-page">
    <section class="auth-hero">
      <img src="/assets/logos/scoutwave-logo.png"  alt="Scoutwave Logo" class="app-logo">
      
       <h1 class="auth-title">Login to Scoutwave</h1>
 <p class="auth-subtitle">Sign in to continue to your workspace.</p>

    </section>

    <section class="auth-card">

      <div class="notice" data-notice></div>

     <button type="button" class="google-auth-button" data-google-signup>
  <span class="google-auth-icon" aria-hidden="true">
    <svg width="30" height="30" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
      <g fill="none" fill-rule="evenodd" clip-rule="evenodd">
        <path fill="#F44336" d="M7.209 1.061c.725-.081 1.154-.081 1.933 0a6.57 6.57 0 0 1 3.65 1.82a100 100 0 0 0-1.986 1.93q-1.876-1.59-4.188-.734q-1.696.78-2.362 2.528a78 78 0 0 1-2.148-1.658a.26.26 0 0 0-.16-.027q1.683-3.245 5.26-3.86" opacity=".987" />
        <path fill="#FFC107" d="M1.946 4.92q.085-.013.161.027a78 78 0 0 0 2.148 1.658A7.6 7.6 0 0 0 4.04 7.99q.037.678.215 1.331L2 11.116Q.527 8.038 1.946 4.92" opacity=".997" />
        <path fill="#448AFF" d="M12.685 13.29a26 26 0 0 0-2.202-1.74q1.15-.812 1.396-2.228H8.122V6.713q3.25-.027 6.497.055q.616 3.345-1.423 6.032a7 7 0 0 1-.51.49" opacity=".999" />
        <path fill="#43A047" d="M4.255 9.322q1.23 3.057 4.51 2.854a3.94 3.94 0 0 0 1.718-.626q1.148.812 2.202 1.74a6.62 6.62 0 0 1-4.027 1.684a6.4 6.4 0 0 1-1.02 0Q3.82 14.524 2 11.116z" opacity=".993" />
      </g>
    </svg>
  </span>
  <span>Continue with Google</span>
</button>

<div class="auth-divider">
  <span>Or</span>
</div>


      <form id="loginForm" class="form-grid" novalidate>
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" />
          <small class="error-text"></small>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-stack">
            <input class="input" id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="icon-toggle" data-password-toggle="loginPassword"><svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M8.06 2C3 2 0 8 0 8s3 6 8.06 6C13 14 16 8 16 8s-3-6-7.94-6zM8 12c-2.2 0-4-1.78-4-4c0-2.2 1.8-4 4-4c2.22 0 4 1.8 4 4c0 2.22-1.78 4-4 4zm2-4c0 1.11-.89 2-2 2c-1.11 0-2-.89-2-2c0-1.11.89-2 2-2c1.11 0 2 .89 2 2z" fill="currentColor"/>
</svg></button>
          </div>
          <small class="error-text"></small>
        </div>

        <div class="row">
          

          
      
          <a class="secondary-link" href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="primary">
          <span class="btn-label">Login</span>
          <span class="spinner"></span>
        </button>

        <p class="form-footer">
          Don’t have an account?
          <a class="secondary-link" href="signup">Create one</a>
        </p>
      </form>

    </section>
  </main>

  <script src="/js/script.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/supabase/client.js"></script>

<script src="/supabase/auth.js"></script>
<script src="/supabase/database.js"></script>
<script src="/supabase/storage.js"></script>
</body>
</html>
